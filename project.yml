name: Life
options:
  bundleIdPrefix: local.life
  deploymentTarget:
    iOS: "17.0"
packages:
  WhoopCore:
    path: .
targets:
  Life:
    type: application
    platform: iOS
    sources:
      - Sources/WhoopCollector
    dependencies:
      - package: WhoopCore
        product: WhoopCore
    configFiles:
      Debug: Config/App.xcconfig
      Release: Config/App.xcconfig
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
    info:
      path: build/Info.plist
      properties:
        CFBundleDisplayName: Life
        LifeIngestionURL: $(LIFE_INGESTION_URL)
        NSBluetoothAlwaysUsageDescription: Read heart rate, battery, and history from your WHOOP strap.
        UIBackgroundModes: [bluetooth-central]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
