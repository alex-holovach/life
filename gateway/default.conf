map $http_upgrade $connection_upgrade { default upgrade; '' close; }
map $http_x_forwarded_proto $forwarded_scheme { default $http_x_forwarded_proto; '' $scheme; }
server {
    listen 8080;
    server_tokens off;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $life_api http://api:8000;
    set $life_dashboard http://grafana:3000;
    access_log off;
    client_max_body_size 2m;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $forwarded_scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    location = /v1/batches { proxy_pass $life_api; }
    location = /v1/status { proxy_pass $life_api; }
    location = /v1/sensors { proxy_pass $life_api; }
    location = /v1/hrv { proxy_pass $life_api; }
    location = /v1/vitals { proxy_pass $life_api; }
    location = /v1/wellness { proxy_pass $life_api; }
    location = /v1/profile { proxy_pass $life_api; }
    location ~ "^/v1/sleep/[0-9a-fA-F-]{36}$" { proxy_pass $life_api; }
    location = /v1/temperature { proxy_pass $life_api; }
    location = /health { proxy_pass $life_api; }
    location = /metrics { return 404; }
    location /v1/ { return 404; }
    location / {
        proxy_pass $life_dashboard;
        proxy_http_version 1.1;
        # Location-level WebSocket headers prevent inheritance of server headers.
        # Preserve the browser-facing host for Grafana's cookie-based CSRF checks.
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $forwarded_scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
